<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#236A54"/></marker></defs><rect width="1920" height="1080" fill="#F6F7F0"/><text x="93.60000000000001" y="60.599999999999994" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#236A54">DIGITAL MEDICO  /  COMPLETE WEBSITE WORKFLOW</text><text x="93.60000000000001" y="161.64" font-family="Arial,sans-serif" font-size="60" font-weight="700" fill="#193F35">From sign-in to connected care.</text><text x="93.60000000000001" y="223.07999999999998" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#687E72">Full-stack prototype: React interface → Python API → SQLite persistence.</text><rect x="93.60000000000001" y="288.0" width="436.32" height="486.71999999999997" rx="14" fill="#FFFFFF" stroke="#DCE5DA" stroke-width="2"/><text x="126.72" y="334.2" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#236A54">01  /  FRONTEND</text><text x="126.72" y="407.76" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#193F35">React + Vite</text><rect x="126.72" y="446.40000000000003" width="368.64" height="105.12" rx="14" fill="#EAF1E7" stroke="#DCE5DA" stroke-width="2"/><text x="149.76" y="485.70000000000005" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#193F35">PATIENT PORTAL</text><text x="149.76" y="516.34" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#193F35">History • consent • questions</text><rect x="126.72" y="576.0" width="368.64" height="105.12" rx="14" fill="#EAF1E7" stroke="#DCE5DA" stroke-width="2"/><text x="149.76" y="615.3" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#193F35">DOCTOR PORTAL</text><text x="149.76" y="645.9399999999999" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#193F35">Records • prescriptions • replies</text><text x="126.72" y="728.76" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#687E72">CSS + icons • browser reminders</text><rect x="642.24" y="288.0" width="590.4" height="486.71999999999997" rx="14" fill="#EAF1E7" stroke="#DCE5DA" stroke-width="2"/><text x="672.48" y="334.2" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#236A54">02  /  PYTHON HTTP API</text><rect x="672.48" y="377.28000000000003" width="529.9200000000001" height="100.8" rx="14" fill="#FFFFFF" stroke="#DCE5DA" stroke-width="2"/><text x="695.52" y="413.70000000000005" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#193F35">LOGIN → SESSION</text><text x="695.52" y="444.34000000000003" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#193F35">Salted scrypt passwords • HttpOnly cookie</text><line x1="937.4399999999999" y1="483.84" x2="937.4399999999999" y2="511.2" stroke="#236A54" stroke-width="3" marker-end="url(#arrow)"/><rect x="672.48" y="519.84" width="529.9200000000001" height="93.60000000000001" rx="14" fill="#FFFFFF" stroke="#DCE5DA" stroke-width="2"/><text x="695.52" y="554.82" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#193F35">CHECK EACH MEDICAL REQUEST</text><text x="695.52" y="585.46" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#193F35">Session • role • patient scope • consent</text><line x1="937.4399999999999" y1="619.1999999999999" x2="937.4399999999999" y2="645.1200000000001" stroke="#236A54" stroke-width="3" marker-end="url(#arrow)"/><rect x="672.48" y="653.76" width="529.9200000000001" height="89.28" rx="14" fill="#FFFFFF" stroke="#DCE5DA" stroke-width="2"/><text x="695.52" y="687.3" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#193F35">RUN WORKFLOW + RECORD ACTIVITY</text><text x="695.52" y="717.9399999999999" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#193F35">Visits • medicines • messages • audit</text><rect x="1349.28" y="288.0" width="475.2" height="486.71999999999997" rx="14" fill="#FFFFFF" stroke="#DCE5DA" stroke-width="2"/><text x="1380.96" y="334.2" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#236A54">03  /  DATA STORAGE</text><text x="1380.96" y="407.76" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#193F35">Local SQLite</text><rect x="1382.3999999999999" y="447.84" width="410.40000000000003" height="234.71999999999997" rx="14" fill="#EAF1E7" stroke="#DCE5DA" stroke-width="2"/><text x="1408.32" y="488.88" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#193F35">Users + patient profiles</text><text x="1408.32" y="521.76" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#193F35">Consent + medical records</text><text x="1408.32" y="554.64" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#193F35">Prescriptions + dose logs</text><text x="1408.32" y="587.52" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#193F35">Messages + access audit</text><text x="1380.96" y="733.0799999999999" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#687E72">Patient-scoped reads / writes</text><line x1="535.6800000000001" y1="429.12" x2="633.6" y2="429.12" stroke="#236A54" stroke-width="3" marker-end="url(#arrow)"/><text x="541.4399999999999" y="390.06000000000006" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#236A54">/api</text><line x1="1238.3999999999999" y1="576.0" x2="1340.64" y2="576.0" stroke="#236A54" stroke-width="3" marker-end="url(#arrow)"/><text x="1251.36" y="544.14" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#236A54">SQL</text><line x1="1340.64" y1="646.5600000000001" x2="1238.3999999999999" y2="646.5600000000001" stroke="#236A54" stroke-width="3" marker-end="url(#arrow)"/><line x1="937.4399999999999" y1="780.48" x2="937.4399999999999" y2="830.8799999999999" stroke="#236A54" stroke-width="3"/><line x1="937.4399999999999" y1="830.8799999999999" x2="311.76" y2="830.8799999999999" stroke="#236A54" stroke-width="3"/><line x1="311.76" y1="830.8799999999999" x2="311.76" y2="780.48" stroke="#236A54" stroke-width="3" marker-end="url(#arrow)"/><text x="378.71999999999997" y="806.5200000000001" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#236A54">JSON response → interface refresh</text><text x="1012.32" y="810.8399999999999" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#687E72">Failed checks → 401 / 403; doctor consent revoked → blocked.</text><text x="93.60000000000001" y="890.04" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#236A54">THE CARE LOOP</text><rect x="93.60000000000001" y="920.16" width="375.84" height="87.84" rx="14" fill="#FFFFFF" stroke="#DCE5DA" stroke-width="2"/><text x="115.2" y="950.5200000000001" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193F35">Patient grants consent</text><text x="115.2" y="978.9200000000001" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193F35">Ask a question / log a dose</text><rect x="527.04" y="920.16" width="375.84" height="87.84" rx="14" fill="#FFFFFF" stroke="#DCE5DA" stroke-width="2"/><text x="548.64" y="950.5200000000001" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193F35">API checks permission</text><text x="548.64" y="978.9200000000001" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193F35">Read / save patient data</text><rect x="961.92" y="920.16" width="375.84" height="87.84" rx="14" fill="#FFFFFF" stroke="#DCE5DA" stroke-width="2"/><text x="983.52" y="950.5200000000001" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193F35">Doctor provides care</text><text x="983.52" y="978.9200000000001" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193F35">Visit / prescription / reply</text><rect x="1396.8" y="920.16" width="427.68" height="87.84" rx="14" fill="#FFFFFF" stroke="#DCE5DA" stroke-width="2"/><text x="1418.3999999999999" y="950.5200000000001" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193F35">Patient sees updates</text><text x="1418.3999999999999" y="978.9200000000001" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193F35">History / reminders / replies</text><line x1="476.64" y1="964.8000000000001" x2="518.4" y2="964.8000000000001" stroke="#236A54" stroke-width="3" marker-end="url(#arrow)"/><line x1="910.08" y1="964.8000000000001" x2="953.28" y2="964.8000000000001" stroke="#236A54" stroke-width="3" marker-end="url(#arrow)"/><line x1="1344.96" y1="964.8000000000001" x2="1388.16" y2="964.8000000000001" stroke="#236A54" stroke-width="3" marker-end="url(#arrow)"/><text x="93.60000000000001" y="1040.94" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#687E72">Emergency biometric check is simulated; WebAuthn is planned. Local DB is not encrypted at rest. Fictional data only.</text></svg>