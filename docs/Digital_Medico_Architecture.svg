<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#236A54"/></marker></defs><rect width="1920" height="1080" fill="#F6F7F0"/><text x="93.60000000000001" y="60.599999999999994" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#236A54">DIGITAL MEDICO  /  CURRENT FRONTEND ARCHITECTURE</text><text x="93.60000000000001" y="161.64" font-family="Arial,sans-serif" font-size="60" font-weight="700" fill="#193F35">Two portals. One controlled care flow.</text><text x="93.60000000000001" y="225.95999999999998" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#687E72">A working browser prototype of patient consent and doctor approval.</text><rect x="79.2" y="285.12" width="1759.68" height="394.56000000000006" rx="14" fill="#EAF1E7" stroke="#DCE5DA" stroke-width="2"/><text x="115.2" y="318.06000000000006" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#236A54">EVERYTHING BELOW RUNS IN THE USER’S BROWSER</text><rect x="115.2" y="362.88" width="472.32" height="280.8" rx="14" fill="#FFFFFF" stroke="#DCE5DA" stroke-width="2"/><text x="144.0" y="418.98" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#193F35">React website</text><rect x="144.0" y="453.59999999999997" width="194.4" height="60.48" rx="14" fill="#EAF1E7" stroke="#DCE5DA" stroke-width="2"/><text x="159.84" y="483.96000000000004" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#236A54">PATIENT</text><rect x="360.0" y="453.59999999999997" width="194.4" height="60.48" rx="14" fill="#EAF1E7" stroke="#DCE5DA" stroke-width="2"/><text x="381.59999999999997" y="483.96000000000004" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#236A54">DOCTOR</text><text x="144.0" y="568.0799999999999" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#687E72">History • prescriptions • chat</text><text x="144.0" y="600.9599999999999" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#687E72">React + JavaScript + CSS</text><rect x="682.5600000000001" y="362.88" width="482.40000000000003" height="280.8" rx="14" fill="#FFFFFF" stroke="#DCE5DA" stroke-width="2"/><text x="712.8000000000001" y="417.24" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#193F35">Browser demo service</text><text x="712.8000000000001" y="486.0" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#687E72">Demo login + role checks</text><text x="712.8000000000001" y="518.88" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#687E72">Consent + approval simulation</text><text x="712.8000000000001" y="551.76" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#687E72">Records, replies + dose updates</text><rect x="1264.32" y="362.88" width="538.5600000000001" height="280.8" rx="14" fill="#FFFFFF" stroke="#DCE5DA" stroke-width="2"/><text x="1293.1200000000001" y="418.98" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#193F35">Browser storage</text><text x="1293.1200000000001" y="486.3" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#236A54">localStorage</text><text x="1293.1200000000001" y="526.02" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#687E72">Accounts, records, messages, consent</text><text x="1293.1200000000001" y="577.02" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#236A54">sessionStorage</text><text x="1293.1200000000001" y="616.74" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#687E72">Current login + simulated approval</text><line x1="593.28" y1="468.0" x2="673.92" y2="468.0" stroke="#236A54" stroke-width="3" marker-end="url(#arrow)"/><line x1="673.92" y1="529.9200000000001" x2="593.28" y2="529.9200000000001" stroke="#236A54" stroke-width="3" marker-end="url(#arrow)"/><line x1="1170.72" y1="468.0" x2="1255.68" y2="468.0" stroke="#236A54" stroke-width="3" marker-end="url(#arrow)"/><line x1="1255.68" y1="529.9200000000001" x2="1170.72" y2="529.9200000000001" stroke="#236A54" stroke-width="3" marker-end="url(#arrow)"/><text x="93.60000000000001" y="735.96" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#236A54">DOCTOR RECORD ACCESS  /  DEMONSTRATED FLOW</text><rect x="93.60000000000001" y="781.92" width="292.32" height="118.08" rx="14" fill="#FFFFFF" stroke="#DCE5DA" stroke-width="2"/><text x="126.72" y="831.6" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#193F35">Doctor demo login</text><text x="126.72" y="864.48" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#193F35">Role = doctor</text><polygon points="604.08,761.76 730.08,840.96 604.08,920.1600000000001 478.08,840.96" fill="#EAF1E7" stroke="#236A54" stroke-width="2"/><text x="534.24" y="822.66" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#193F35">Patient</text><text x="534.24" y="853.3" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#193F35">consent?</text><rect x="839.52" y="781.92" width="421.92" height="118.08" rx="14" fill="#F5E8CC" stroke="#E2D3AC" stroke-width="2"/><text x="874.08" y="829.86" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#193F35">Simulate biometric approval</text><text x="874.08" y="860.5" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#193F35">Button only • no fingerprint scan</text><rect x="1365.1200000000001" y="781.92" width="459.36" height="118.08" rx="14" fill="#FFFFFF" stroke="#DCE5DA" stroke-width="2"/><text x="1402.56" y="829.86" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#193F35">View / update patient records</text><text x="1402.56" y="860.5" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#193F35">History • prescriptions • replies</text><line x1="393.12" y1="840.96" x2="468.0" y2="840.96" stroke="#236A54" stroke-width="3" marker-end="url(#arrow)"/><line x1="740.16" y1="840.96" x2="829.4399999999999" y2="840.96" stroke="#236A54" stroke-width="3" marker-end="url(#arrow)"/><text x="756.0" y="806.22" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#236A54">YES</text><line x1="1271.52" y1="840.96" x2="1355.04" y2="840.96" stroke="#236A54" stroke-width="3" marker-end="url(#arrow)"/><line x1="604.08" y1="924.48" x2="604.08" y2="967.68" stroke="#236A54" stroke-width="3" marker-end="url(#arrow)"/><text x="626.4" y="948.7800000000001" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#236A54">NO</text><rect x="478.08" y="974.8799999999999" width="252.0" height="41.76" rx="14" fill="#F5E5DF" stroke="#E2C8BF" stroke-width="2"/><text x="519.84" y="999.48" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#8B5545">Access blocked</text><text x="93.60000000000001" y="956.2799999999999" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#687E72">Vite serves &amp; builds the UI.</text><text x="93.60000000000001" y="984.6799999999998" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#687E72">No backend / API in this version.</text><text x="864.0" y="954.8399999999999" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#687E72">Browser checks can be bypassed. Fictional data only.</text><text x="864.0" y="983.2399999999999" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#687E72">Real authentication and WebAuthn are future work.</text><rect x="93.60000000000001" y="1029.6000000000001" width="1728" height="1.8719999999999999" rx="0" fill="#DCE5DA" stroke="#DCE5DA" stroke-width="2"/><text x="93.60000000000001" y="1060.8" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#687E72">DIGITAL MEDICO   •   CARE, CONNECTED.</text><text x="1605.6000000000001" y="1059.06" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#687E72">ONE-SLIDE ARCHITECTURE</text></svg>